name: Scrape test (IP check)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Rattrapage des marques bloquees depuis l'autre IP
        run: node catchup-blocked-brands.js
