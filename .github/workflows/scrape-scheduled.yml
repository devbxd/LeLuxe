name: Scrape automatique (cron)
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  refresh-batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Rafraichit tout le catalogue (une fois par semaine, le dimanche)
        env:
          BATCH_SIZE: '50'
        run: node refresh-cursor-batch.js
